[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-annotator"
version = "0.1.0"
description = "Local staged Qwen3-VL and official SAM 3 annotation with COCO/CVAT export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "Pillow>=11,<13",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
models = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.6",
    "setuptools>=75,<81",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@f1647e8d0c1d280991f4d1b7d974c2704537fe66",
    "einops>=0.8.1,<1",
    "scipy>=1.15,<2",
    "psutil>=6,<8",
    "opencv-python-headless==4.11.0.86",
    "pycocotools>=2.0.10,<3",
    "decord==0.6.0; sys_platform == 'linux'",
]
dev = ["ruff>=0.11,<1"]

[project.scripts]
auto-annotator = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "contracts", "storage"]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "processing*", "pipeline*", "visualization*", "exporters*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

